<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Dashboard</title>
    <meta
      name="description"
      content="A static GitHub activity dashboard for release readiness, reviews, issues, and Copilot work."
    />
    <meta name="theme-color" content="#0b1120" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css?v=6" />
    <script src="js/theme.js"></script>
    <script src="js/auth.js" defer></script>
    <script src="js/cache.js" defer></script>
    <script src="js/github-client.js" defer></script>
    <script src="js/snapshot-history.js" defer></script>
    <script src="js/repo-activity-meter.js" defer></script>
    <script src="js/repo-recency-bar.js" defer></script>
    <script src="js/release-pressure-indicator.js" defer></script>
    <script src="js/snooze.js" defer></script>
    <script src="js/kanban-lane-chips.js" defer></script>
    <script src="js/backlog-scoring.js" defer></script>
    <script src="js/backlog-strip.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Static GitHub Pages dashboard</p>
          <h1>GitHub Dashboard</h1>
          <p class="page-subtitle" id="header-note">Loading dashboard context…</p>
        </div>
        <div class="header-right">
          <button class="theme-toggle" id="refresh-btn" type="button" aria-label="Refresh private data" hidden>↻</button>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme" onclick="GHD.Theme.toggle()">☀️</button>
          <div class="header-status-stack">
            <div class="header-meta" id="refresh-meta" aria-live="polite">
              Refreshing dashboard data…
            </div>
            <div class="header-health-strip" id="header-health-strip"></div>
          </div>
          <div class="header-sparkline" id="header-sparkline"></div>
          <div class="auth-controls" id="auth-controls" aria-live="polite">
            <span class="view-badge view-badge--public" id="view-badge">Public view</span>
            <button class="auth-btn auth-btn--secondary live-toggle-btn" id="live-toggle-btn" type="button" hidden aria-pressed="false" title="Auto refresh runs every hour">Auto refresh: Off</button>
            <button class="auth-btn" id="sign-in-btn" type="button">Sign in</button>
            <button class="auth-btn auth-btn--secondary" id="sign-out-btn" type="button" hidden>Sign out</button>
          </div>
        </div>
      </header>

      <main>
        <section class="summary-grid" id="summary-grid" aria-label="Dashboard summary"></section>

        <div id="kanban-strip-region" class="kanban-strip-region" hidden></div>

        <div id="backlog-strip-region" class="backlog-strip-region" hidden></div>

        <section class="content-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Repositories</p>
              <h2>Recent repo activity</h2>
            </div>
            <p class="section-copy">
              Release signals, review queues, issues, and Copilot activity for the configured account.
            </p>
          </div>

          <div id="state-region" aria-live="polite"></div>
          <section
            class="repo-grid"
            id="repo-grid"
            aria-label="Repository dashboard cards"
            hidden
          ></section>
        </section>
      </main>
    </div>

    <footer class="page-footer">
      <a class="footer-repo-link" href="https://github.com/jongalloway/GitHubDashboard" target="_blank" rel="noreferrer">
        <svg class="footer-github-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
            -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
            .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
            -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
            .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
            .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
            0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        jongalloway/GitHubDashboard
      </a>
    </footer>

    <noscript>
      <div class="noscript-banner">
        This dashboard needs JavaScript enabled to load <code>data/dashboard.json</code>.
      </div>
    </noscript>
  </body>
</html>
